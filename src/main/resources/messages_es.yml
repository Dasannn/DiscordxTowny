# /dt help, una linea por comando para que el dueno pueda reescribir cualquiera.
help:
  header: "&bDiscordTowny &7— comandos disponibles:"
  cmd-help: "&f/dt help &7— muestra esta lista."
  cmd-link: "&f/dt link &7— obtén un código para vincular tu cuenta de Discord."
  cmd-unlink: "&f/dt unlink &7— deshace la vinculación."
  cmd-status: "&f/dt status &7— tu vínculo y el espacio de tu town."
  cmd-create: "&f/dt create &7— crea el espacio de tu town. Solo el alcalde."
  cmd-delete: "&f/dt delete &7— archiva el espacio de tu town. Solo el alcalde."
  cmd-sync: "&f/dt sync &7— pon tus roles al día."
  cmd-admin-sync: "&f/dt admin sync [town] &7— reconcilia todo, o una town."
  cmd-admin-list: "&f/dt admin list &7— todos los espacios registrados."
  cmd-admin-info: "&f/dt admin info <town> &7— detalle de un espacio."
  cmd-admin-purge: "&f/dt admin purge &7— borra definitivamente los espacios archivados."
  cmd-admin-reload: "&f/dt admin reload &7— recarga configuración y mensajes."
  cmd-admin-unlink: "&f/dt admin unlink <jugador> &7— quita el vínculo de alguien."

