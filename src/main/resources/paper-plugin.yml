name: DiscordTowny
version: '${version}'
main: com.discordtowny.DiscordTownyPlugin
api-version: '1.21'
description: Discord channels and roles managed automatically for every Towny town.
website: https://github.com/Dasannn/DiscordxTowny
authors:
  - Dasannn

permissions:
  discordtowny.use:
    description: Allows using DiscordTowny player commands.
    default: true
  discordtowny.admin:
    description: Allows using DiscordTowny administration commands.
    default: op

dependencies:
  server:
    Towny:
      load: BEFORE
      required: true
      join-classpath: true
